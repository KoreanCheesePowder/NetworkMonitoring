preferences:
  - name: checkInterval
    title: 상태 확인 주기(초)
    description: "각 대상의 TCP 포트 상태를 확인하는 주기"
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 300
      default: 10
  - name: connectTimeout
    title: 연결 제한시간(초)
    description: "한 번의 TCP 연결 확인 제한시간"
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 10
      default: 2
  - name: failThreshold
    title: 비정상 판정 연속 실패 횟수
    description: "이 횟수만큼 연속 실패하면 비정상으로 변경"
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 10
      default: 3

  - name: target1Enabled
    title: "[대상 1] 사용"
    description: "OFF로 바꾸면 이 대상을 삭제/미사용 처리"
    required: true
    preferenceType: boolean
    definition:
      default: true
  - name: target1Name
    title: "[대상 1] 이름"
    description: "상세정보에 표시할 이름"
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "월패드 제어"
  - name: target1Ip
